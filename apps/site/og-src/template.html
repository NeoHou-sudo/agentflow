<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  /* 1200×630 的社交分享卡。
     由 scripts/build-og.mjs 注入主题变量后交给 chromium 截图。
     这里刻意不引用站点的 global.css —— 截图时没有任何页面上下文。 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: __BG__;
    font-family: __BODY_FONT__;
    color: __TEXT__;
    position: relative;
  }
  .accent {
    position: absolute; inset: 0 0 auto 0; height: 7px;
    background: linear-gradient(90deg, __BRAND__, __BRAND2__);
  }
  .glow {
    position: absolute; top: -240px; right: -160px; width: 880px; height: 680px;
    background: radial-gradient(closest-side, rgba(__BRAND2_RGB__,0.26), rgba(__BRAND2_RGB__,0));
  }
  .glow2 {
    position: absolute; bottom: -320px; left: -160px; width: 760px; height: 600px;
    background: radial-gradient(closest-side, rgba(__BRAND_RGB__,0.18), rgba(__BRAND_RGB__,0));
  }
  .inner { position: relative; padding: 68px 82px 0; }
  .brand {
    display: flex; align-items: center; gap: 14px;
    font-size: 33px; font-weight: __H1_WEIGHT__; letter-spacing: .3px; color: __TEXT__;
    font-family: __DISPLAY_FONT__;
  }
  .brand .mark { font-size: 40px; line-height: 1; }
  .brand .sub { font-size: 22px; font-weight: 500; color: __DIM__; letter-spacing: .1em; }
  h1 {
    margin-top: 42px;
    font-size: __H1_SIZE__; font-weight: __H1_WEIGHT__; line-height: 1.16; letter-spacing: __H1_TRACK__;
    color: __TEXT__;
    font-family: __DISPLAY_FONT__;
  }
  h1 em { font-style: __EM_STYLE__; color: __BRAND__; }
  .subline { margin-top: 24px; font-size: 30px; color: __DIM__; font-weight: 500; }
  .pills { position: absolute; left: 82px; bottom: 106px; display: flex; gap: 14px; }
  .pill {
    padding: 13px 26px; border-radius: __PILL_RADIUS__; font-size: 23px; font-weight: 600;
    background: __PANEL__; border: 1.5px solid __LINE__; color: __TEXT__;
    font-family: __BODY_FONT__;
  }
  .pill.hot { border-color: __BRAND__; color: __BRAND__; background: rgba(__BRAND_RGB__,0.10); }
  .url {
    position: absolute; left: 82px; bottom: 46px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 23px; color: __DIM__;
  }
</style>
</head>
<body>
  <div class="accent"></div>
  <div class="glow"></div>
  <div class="glow2"></div>
  <div class="inner">
    <div class="brand">
      <span class="mark">__MARK__</span><span>__NAME__</span>
      <span class="sub">__SUBTITLE__</span>
    </div>
    <h1>__H_LINE1__<br><em>__H_EM__</em>__H_LINE2__</h1>
    <div class="subline">__LEAD__</div>
  </div>
  <div class="pills">__PILLS__</div>
  <div class="url">__URL__</div>
</body>
</html>
