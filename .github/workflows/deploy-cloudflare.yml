name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare secrets
        id: guard
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "跳过一次：仓库还没配 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.guard.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build（SITE_URL 决定 canonical / sitemap）
        if: steps.guard.outputs.ready == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: pnpm build

      - name: Deploy
        if: steps.guard.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/site
          command: deploy
